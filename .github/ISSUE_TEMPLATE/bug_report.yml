name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Security problem?** Don't file it here. Use the Security tab → Report a vulnerability. Don't paste personal data, memories or logs that contain your words."
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options: [Mini (assistant), Mini Dictate (dictation), install.sh / uninstall.sh]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      placeholder: "Steps: 1. … 2. … Expected: … Actual: …"
    validations: { required: true }
  - type: input
    id: mac
    attributes:
      label: Mac and macOS version
      placeholder: "e.g. MacBook Air M3, 8 GB, macOS 26.1"
    validations: { required: true }
